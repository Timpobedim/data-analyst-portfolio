[project]
name = "data-analyst-portfolio"
version = "1.0.0"
description = "Восемь аналитических исследований: данные, проверка гипотез, графики и выводы"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.scripts]
analiz = "analiz.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PT", "RUF", "DTZ"]
# RUF001-003: в русских строках есть кириллица, похожая на латиницу, — это нормально.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S311: данные для исследований генерируются псевдослучайно, это не криптография.
"src/analiz/data.py" = ["S311"]
"tests/**" = ["S101", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["analiz"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# У scipy и matplotlib аннотации неполные: их внутренности проверять нечем, свой код — можно.
[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "sklearn.*"]
ignore_missing_imports = true
